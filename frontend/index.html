<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SIRIS | Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div class="app-shell">
    <section class="login-screen">
      <div class="login-card">
        <div class="brand">
          <span class="brand-kicker">Analitica Geoespacial</span>
          <h1>SIRIS</h1>
          <p>Accede al prototipo para explorar areas de interes en el Pacifico colombiano y simular consultas sobre escenas Sentinel-2.</p>
        </div>

        <div class="credentials-card">
          <strong>Credenciales de prueba</strong>
          <span>Usuario: demo</span>
          <span>Contrasena: demo123</span>
        </div>

        <form class="login-form" id="loginForm">
          <label for="username">Usuario</label>
          <input id="username" name="username" type="text" placeholder="Ingresa tu usuario" required>

          <label for="password">Contrasena</label>
          <input id="password" name="password" type="password" placeholder="Ingresa tu contrasena" required>

          <p class="form-message" id="loginMessage">Ingresa con el usuario de prueba para continuar.</p>
          <button type="submit" id="loginButton">Ingresar</button>
        </form>
      </div>
    </section>
  </div>

  <script src="./login.js"></script>
</body>
</html>
